services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: techjobs
      POSTGRES_PASSWORD: techjobs
      POSTGRES_DB: techjobs
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techjobs -d techjobs"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.4
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      # Stack de desenvolvimento: máquina do candidato pode ter pouco espaço;
      # sem isso o ES recusa alocar shards acima do watermark de disco (90%).
      cluster.routing.allocation.disk.threshold_enabled: "false"
    ports:
      - "127.0.0.1:9200:9200"
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -sf 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  api:
    build: ./backend
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ConnectionStrings__Postgres: Host=postgres;Database=techjobs;Username=techjobs;Password=techjobs
      ConnectionStrings__Redis: redis:6379
      Elasticsearch__Url: http://elasticsearch:9200
      Cache__DetailsTtlSeconds: "300"
      Cache__SearchTtlSeconds: "60"
      ENABLE_TEST_ENDPOINTS: "true"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
