name: ci

# Smoke + testes: garante que `docker compose up` sobe API, PostgreSQL, Redis,
# Elasticsearch e frontend; valida /health, o frontend, os testes de unidade e a
# suíte de integração black-box contra o contrato de API do README. Este é o
# pré-requisito mínimo — a avaliação final usa suíte adicional, então mantenha
# rotas, portas e campos exatamente como especificado.

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Testes de unidade (validação, chave de cache, seed)
        run: dotnet test backend/TechJobs.slnx --filter "FullyQualifiedName~UnitTests"

      - name: Sobe a stack
        run: docker compose up -d --build

      - name: Aguarda API saudável (GET /health)
        run: |
          deadline=$((SECONDS + 180))
          until curl -sf http://localhost:8080/health >/dev/null; do
            if (( SECONDS > deadline )); then
              echo "API não respondeu em /health dentro de 180s"
              exit 1
            fi
            sleep 2
          done
          echo "API saudável."

      - name: Frontend responde
        run: curl -sf http://localhost:3000/ >/dev/null

      - name: Testes de integração (contrato de API, cache, falhas simuladas)
        env:
          TECHJOBS_API: 'http://localhost:8080'
        run: dotnet test backend/TechJobs.slnx --filter "FullyQualifiedName~IntegrationTests"

      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs --tail 100

      - name: Derruba a stack
        if: always()
        run: docker compose down -v
